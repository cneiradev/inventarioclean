# Perfil local: corre sin PostgreSQL (H2 en memoria) para desarrollo rapido.
# Se activa con: spring.profiles.active=local
# Flyway crea el schema (V1). Los datos se administran desde la app.

spring:
  datasource:
    url: jdbc:h2:mem:inventario_ar;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  h2:
    console:
      enabled: true
      path: /h2-console
  # La migracion V1 usa sintaxis PostgreSQL (BIGSERIAL, TIMESTAMPTZ). En H2
  # con MODE=PostgreSQL casi todo es compatible; si alguna sentencia falla en
  # H2 pero funciona en Postgres, se protege con una rama especifica.
  sql:
    init:
      mode: never

app:
  jwt:
    # Clave de desarrollo SOLO. En produccion viene de JWT_SECRET.
    secret: ${JWT_SECRET:clave-de-desarrollo-local-no-usar-en-produccion-0123456789}
